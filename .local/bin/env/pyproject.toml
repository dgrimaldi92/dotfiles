[project]
name = "env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dgrimaldi92", email = "grimi.david@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
env = "env:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "B",
    "A",
    "N",
    "COM",
    "ICN",
    "T20",
    "PIE",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ARG",
    "PD",
    "PLR",
    "C",
    "W",
    "TRY",
    "FLY",
    "NPY",
    "PERF",
    "FURB",
    "RUF",
    "ISC",
    "TC",
    "PTH",
    "TD",
    "BLE",
    "PGH003",
    "ANN"
]
fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
preview = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"


[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

# NOTE: the following rules are known to have a significant number of false positives,
# which is mostly unavoidable. Enable them at your own risk!
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ruff]
exclude = [
    ".venv/",
]
line-length = 88
indent-width = 4
target-version = "py314"
