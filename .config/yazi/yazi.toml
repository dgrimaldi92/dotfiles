[opener]
edit = [
	{ run = "nvim %s", block = true, for = "unix" },
]
terminal = [
  	{ run = "ghostty --working-directory=%s", block = false, for = "unix" },
]
[open]
rules = [
    { mime = "inode/directory", use = "terminal" },
    { mime = "text/*", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { url = "*", use = "edit" },
]
[mgr]
show_hidden = true
sort_by="mtime"

