# foot configuration
# Template/source: Arch Wiki (https://wiki.archlinux.org/title/foot)
# and "foot with true-color tmux support" (https://dev.to/sailorfe/foot-with-true-color-tmux-support-a-la-alacritty-25gj)
#
# IMPORTANT FOR TMUX: install the `foot-terminfo` package for upstream terminfo
# with application synchronized updates + 24-bit color (Arch: https://archlinux.org/packages/?name=foot-terminfo)

[main]
# Tell foot to advertise a universally-recognized truecolor terminfo so tmux
# can pass 24-bit color through.
term=xterm-256color

font=JetBrainsMono NF:size=12


# Optional: include a color theme (uncomment and point to your theme file)
# include=~/.config/foot/moonqueen.ini

[scrollback]
lines=100000

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

# NOTE: Since foot 1.26.0 the [colors] section was renamed to
# [colors-dark] (and a new [colors-light] section was added). The old
# [colors] name is no longer valid.
[colors-dark]
alpha=0.9
