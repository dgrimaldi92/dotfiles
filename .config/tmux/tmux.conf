# tmux configuration for use with the foot terminal
# Color setup sourced from:
#   - tmux.app config reference (https://tmux.app/config/)
#   - tmux-sensible-revamped (https://github.com/tmux-revamped/tmux-sensible-revamped)
#   - "foot with true-color tmux support" (https://dev.to/sailorfe/foot-with-true-color-tmux-support-a-la-alacritty-25gj)

# ---------------------------------------------------------------------------
# Terminal / truecolor support (foot -> tmux)
# ---------------------------------------------------------------------------
# TERM value used for tmux's inner terminals. tmux-256color enables 24-bit color.
set -g default-terminal "tmux-256color"

# Tell tmux that the OUTER terminal (foot, which reports as xterm-256color)
# supports truecolor (RGB). Works on all tmux versions.
set -ga terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------------------------
# Prefix key: Ctrl-Space (was the default Ctrl-b)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Newer alternative for tmux 3.3+ (applies RGB feature to all terminals).
# Uncomment if you're on tmux 3.3 or newer and prefer the newer API:
# set -sg terminal-features "*:RGB"

# ---------------------------------------------------------------------------
# Clipboard (OSC52) — lets tmux use the system/Wayland clipboard
# ---------------------------------------------------------------------------
set -g set-clipboard on

# ---------------------------------------------------------------------------
# General usability
# ---------------------------------------------------------------------------
# Reduce keystroke lag (also the tmux 3.5+ default).
set -sg escape-time 0

# Larger scrollback history.
set -g history-limit 50000

# Use vi-style copy mode bindings.
set -g mode-keys vi

# Renumber windows after closing one.
set -g renumber-windows on

# Start new windows/panes in the current directory.
bind c new-window -c "$CURRENT_DIR"
bind % split-window -v -c "$CURRENT_DIR"
bind '"' split-window -h -c "$CURRENT_DIR"

# Simpler pane resizing (hold Alt).
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up   resize-pane -U 5
bind -r Down resize-pane -D 5

set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on

# ---------------------------------------------------------------------------
# Llama server session
# Run ~/.local/bin/llama-session (GGML_CUDA env vars + --models-dir/.models
# + --models-preset/.pi). Creates a NEW WINDOW in the current session and
# runs llama-server in it. -c "$HOME" sets the window's directory so the
# script's relative .models / .pi paths resolve. -r makes it chordable and
# repeatable (each press opens another window).
# ---------------------------------------------------------------------------
bind-key -r l new-window -n 'dev' \; send-keys "llama-session" Enter 
