[*]
mmap = 1
jinja = true


; spec-draft-n-max = 3              <-- Increase for potential speed boost
; cache-type-k = q8_0               <-- Quantize cache to fit more of the model on GPU
; cache-type-v = q8_0               <-- Quantize cache to fit more of the model on GPU
; ctx-size = 32768                  <-- Slightly lower to ensure stability
; threads = 7                       <-- Slight increase for Ryzen architecture

; ============================================================
; GEMMA 4 26B A4B QAT — TESTED, CONFIRMED WORKING
; MTP acceptance verified near 100% on short replies, real
; throughput measured on long generation, reasoning-off/on
; both confirmed functional via /v1/models curl tests.
; ============================================================
[gemma26b-qat]
model            = /home/dav/.models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
spec-draft-model = /home/dav/.models/mtp-gemma-4-26B-A4B-it.gguf
spec-type        = draft-mtp
spec-draft-n-max = 2
reasoning        = on
reasoning-budget     = 4096
reasoning-budget-message = "Reasoning budget reached, answering now."
flash-attn       = on
fit              = on
fit-target       = 1536
cache-type-k     = f16
cache-type-v     = f16
ctx-size         = 65536
threads          = 6
threads-batch    = 12
repeat-penalty   = 1.1
temp             = 1.0
top-p            = 0.95
top-k            = 64

; ============================================================
; GLM-4.7-FLASH — CONFIGURED, NOT YET LOAD-TESTED BY YOU
; Documented community reports of tool-call streaming issues
; and context-dependent repetition loops on this model. Test
; the tool-calling curl before trusting it in a real session.
; ============================================================
[glm47-flash]
model            = /home/dav/.models/GLM-4.7-Flash-UD-Q4_K_XL.gguf
flash-attn       = on
fit              = on
fit-target       = 1536
ctx-size         = 65536
batch-size       = 1024
ubatch-size      = 256
temp             = 0.7
top-p            = 1.0
min-p            = 0.01
repeat-penalty   = 1.0

; ============================================================
; QWEN3.8-27B — DENSE, CONFIGURED, NOT YET TESTED
; No MoE, so --n-cpu-moe/--fit-auto doesn't apply. Uses manual
; FFN offload (-ot) or --n-cpu-ffn if your build has it post
; Aug 27 2026. Layer count below is a starting guess, sweep
; against real nvidia-smi output before trusting it.
; ============================================================
[qwen38-27b]
model              = /home/dav/.models/Qwen3.8-27B-UD-Q3_K_M.gguf
n-gpu-layers       = 99
override-tensor    = blk\.([0-9]|1[0-9])\.ffn_(gate|up|down)\.weight=CPU
fit                = off
reasoning          = on
reasoning-effort   = medium
reasoning-budget          = 4096
reasoning-budget-message  = "Reasoning budget reached, answering now."
flash-attn         = on
cache-type-k       = q5_0
cache-type-v       = q5_0
ctx-size           = 65536
threads            = 12
threads-batch      = 12
batch-size         = 512
ubatch-size        = 512
temp               = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0

; ============================================================
; NEMOTRON-3-NANO-30B-A3B — MoE, CONFIGURED, UNVERIFIED
; Sampling values are reasonable defaults, not a confirmed
; vendor recommendation. GGUF filename below is inferred from
; Unsloth's naming convention, not checked against the repo.
; ============================================================
[nemotron3-nano]
